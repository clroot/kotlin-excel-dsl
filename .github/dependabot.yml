version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        exclude-patterns: ["org.jetbrains.kotlin*"]
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /compatibility
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
